<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="50%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#39d353"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#a371f7;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#39d353;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#39d353;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="900" height="200" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Decorative dots top-left -->
  <circle cx="40" cy="40" r="2" fill="#a371f7" opacity="0.5"/>
  <circle cx="55" cy="30" r="1.5" fill="#58a6ff" opacity="0.4"/>
  <circle cx="30" cy="58" r="1.5" fill="#39d353" opacity="0.4"/>
  <circle cx="68" cy="48" r="1" fill="#a371f7" opacity="0.3"/>

  <!-- Decorative dots top-right -->
  <circle cx="860" cy="40" r="2" fill="#39d353" opacity="0.5"/>
  <circle cx="845" cy="30" r="1.5" fill="#58a6ff" opacity="0.4"/>
  <circle cx="870" cy="58" r="1.5" fill="#a371f7" opacity="0.4"/>
  <circle cx="832" cy="48" r="1" fill="#39d353" opacity="0.3"/>

  <!-- Tamil script title -->
  <text x="450" y="88" text-anchor="middle"
    font-family="'Noto Sans Tamil', 'Arial Unicode MS', sans-serif"
    font-size="52" font-weight="700"
    fill="url(#textGrad)">தமிழாக்கம்</text>

  <!-- English subtitle -->
  <text x="450" y="122" text-anchor="middle"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="18" font-weight="600" letter-spacing="1"
    fill="#c9d1d9">TAMILAAKKAM</text>

  <!-- Gradient divider line -->
  <rect x="200" y="136" width="500" height="1.5" rx="1" fill="url(#lineGrad)"/>

  <!-- Tagline -->
  <text x="450" y="164" text-anchor="middle"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="13" font-weight="400" letter-spacing="0.5"
    fill="#8b949e">Tanglish → Tamil Unicode · OCR-Powered Transliteration</text>

  <!-- Small Tamil sample bottom -->
  <text x="450" y="186" text-anchor="middle"
    font-family="'Noto Sans Tamil', 'Arial Unicode MS', sans-serif"
    font-size="11" fill="#484f58">vanakkam nanba  →  வணக்கம் நண்பா</text>
</svg>
